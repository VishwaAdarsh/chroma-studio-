<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="chroma-bg-glow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09070A" stop-opacity="0" />
    </radialGradient>

    <!-- Rainbow Ribbon Gradient -->
    <linearGradient id="chroma-c-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="25%" stop-color="#2563FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="75%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#FF9A3C" />
    </linearGradient>

    <!-- Top Curve Cyan-Blue Gradient -->
    <linearGradient id="chroma-c-top" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2563FF" />
    </linearGradient>

    <!-- Bottom Turn Magenta-Orange Gradient -->
    <linearGradient id="chroma-c-bottom" x1="0%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="40%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#FF9A3C" />
    </linearGradient>

    <!-- Frame Corner Gradients -->
    <linearGradient id="chroma-frame-tl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="chroma-frame-tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2563FF" />
    </linearGradient>
    <linearGradient id="chroma-frame-bl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563FF" />
    </linearGradient>
    <linearGradient id="chroma-frame-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Sparkle Gold Gradient -->
    <linearGradient id="chroma-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FF9A3C" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base Background -->
  <rect width="100" height="100" rx="22" fill="#09070A" />
  <rect width="100" height="100" rx="22" fill="url(#chroma-bg-glow)" />

  <!-- Viewfinder Frame Brackets (Camera Aesthetic) -->
  <g stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" filter="url(#neon-glow)">
    <!-- Top-Left Bracket -->
    <path d="M 21,32 L 21,24 C 21,21 23,19 26,19 L 34,19" stroke="url(#chroma-frame-tl)" />
    <!-- Top-Right Bracket -->
    <path d="M 66,19 L 74,19 C 77,19 79,21 79,24 L 79,32" stroke="url(#chroma-frame-tr)" />
    <!-- Bottom-Left Bracket -->
    <path d="M 21,68 L 21,76 C 21,79 23,81 26,81 L 34,81" stroke="url(#chroma-frame-bl)" />
    <!-- Bottom-Right Bracket -->
    <path d="M 66,81 L 74,81 C 77,81 79,79 79,76 L 79,68" stroke="url(#chroma-frame-br)" />
  </g>

  <!-- The Vibrant 3D Chroma 'C' Ribbon -->
  <g filter="url(#neon-glow)">
    <!-- Main Outer C Body -->
    <path
      d="M 63.5,31 C 59.5,25.5 52,22.5 44,24.5 C 32,27.5 25,38 25,50 C 25,62 32,72.5 44,75.5 C 52,77.5 59.5,74.5 63.5,69 C 66,65.5 67,61.5 65.5,58.5 C 64,55.5 60.5,54.5 56.5,56 C 51.5,58 45.5,55 43,49.5 C 41,45 42,40 45.5,37 C 49,34 54,34.5 58,37.5 C 61,39.5 64.5,38.5 65.5,35.5 C 66.5,32.5 65.5,29.5 63.5,31 Z"
      fill="url(#chroma-c-ribbon)"
    />

    <!-- Overlapping Ribbon Layer for 3D depth and luminous flow -->
    <path
      d="M 63.5,31 C 55,23.5 40,24 32,32 C 24,40 24,52 30,62 C 34,68 42,75 51,75.5 C 60,76 65,71 63.5,69 C 58,61.5 48,58.5 42,50 C 37,42 41,31 51,27 C 56,25 61,27.5 63.5,31 Z"
      fill="url(#chroma-c-top)"
      opacity="0.85"
    />

    <!-- Bottom Warm Gradient Curl -->
    <path
      d="M 44,75.5 C 52,77.5 60,75 64,68.5 C 67,63.5 65,57.5 60,56.5 C 55,55.5 50,58 46,62 C 41,67 40,73 44,75.5 Z"
      fill="url(#chroma-c-bottom)"
      opacity="0.95"
    />

    <!-- Inner Aperture Depth Core -->
    <ellipse cx="48" cy="50" rx="9.5" ry="10" fill="#09070A" opacity="0.9" />
  </g>

  <!-- 4-Point Golden Sparkle Star (Top Right of C) -->
  <g transform="translate(68, 29)">
    <path
      d="M 0,-6.5 Q 0.6,-1.2 5,-0.2 Q 0.6,0.8 0,6.5 Q -0.6,0.8 -5,-0.2 Q -0.6,-1.2 0,-6.5 Z"
      fill="url(#chroma-sparkle)"
    />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
