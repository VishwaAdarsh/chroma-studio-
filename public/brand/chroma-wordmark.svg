<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ribbon Gradient -->
    <linearGradient id="wm-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="25%" stop-color="#2563FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="75%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#FF9A3C" />
    </linearGradient>

    <!-- Top Curve Cyan-Blue Gradient -->
    <linearGradient id="wm-top" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2563FF" />
    </linearGradient>

    <!-- Bottom Turn Magenta-Orange Gradient -->
    <linearGradient id="wm-bottom" x1="0%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="40%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#FF9A3C" />
    </linearGradient>

    <!-- Frame Gradients -->
    <linearGradient id="wm-frame-tl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="wm-frame-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Sparkle Gold -->
    <linearGradient id="wm-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FF9A3C" />
    </linearGradient>

    <!-- Gradient A Leg -->
    <linearGradient id="wm-accent-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
  </defs>

  <!-- Left: The Emblem Symbol (Scaled to 54x54, centered at X=32, Y=32) -->
  <g transform="translate(6, 5) scale(0.54)">
    <!-- Dark Backplate -->
    <rect width="100" height="100" rx="20" fill="#09070A" />

    <!-- Brackets -->
    <g stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <path d="M 20,32 L 20,23 C 20,20 22,18 25,18 L 34,18" stroke="url(#wm-frame-tl)" />
      <path d="M 66,18 L 75,18 C 78,18 80,20 80,23 L 80,32" stroke="#00E5FF" />
      <path d="M 20,68 L 20,77 C 20,80 22,82 25,82 L 34,82" stroke="#2563FF" />
      <path d="M 66,82 L 75,82 C 78,82 80,80 80,77 L 80,68" stroke="url(#wm-frame-br)" />
    </g>

    <!-- C Ribbon -->
    <path
      d="M 63.5,31 C 59.5,25.5 52,22.5 44,24.5 C 32,27.5 25,38 25,50 C 25,62 32,72.5 44,75.5 C 52,77.5 59.5,74.5 63.5,69 C 66,65.5 67,61.5 65.5,58.5 C 64,55.5 60.5,54.5 56.5,56 C 51.5,58 45.5,55 43,49.5 C 41,45 42,40 45.5,37 C 49,34 54,34.5 58,37.5 C 61,39.5 64.5,38.5 65.5,35.5 C 66.5,32.5 65.5,29.5 63.5,31 Z"
      fill="url(#wm-ribbon)"
    />
    <path
      d="M 63.5,31 C 55,23.5 40,24 32,32 C 24,40 24,52 30,62 C 34,68 42,75 51,75.5 C 60,76 65,71 63.5,69 C 58,61.5 48,58.5 42,50 C 37,42 41,31 51,27 C 56,25 61,27.5 63.5,31 Z"
      fill="url(#wm-top)"
      opacity="0.85"
    />
    <path
      d="M 44,75.5 C 52,77.5 60,75 64,68.5 C 67,63.5 65,57.5 60,56.5 C 55,55.5 50,58 46,62 C 41,67 40,73 44,75.5 Z"
      fill="url(#wm-bottom)"
      opacity="0.95"
    />
    <ellipse cx="48" cy="50" rx="9.5" ry="10" fill="#09070A" opacity="0.9" />

    <!-- Sparkle -->
    <g transform="translate(68, 29)">
      <path d="M 0,-6.5 Q 0.6,-1.2 5,-0.2 Q 0.6,0.8 0,6.5 Q -0.6,0.8 -5,-0.2 Q -0.6,-1.2 0,-6.5 Z" fill="url(#wm-sparkle)" />
    </g>
  </g>

  <!-- Right: Typography matching official logo -->
  <g transform="translate(74, 14)">
    <!-- Primary Word: CHROMA -->
    <text
      x="0"
      y="24"
      fill="#F8FAFC"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="25"
      font-weight="900"
      letter-spacing="1.5"
    >
      CHROM<tspan fill="url(#wm-accent-a)">A</tspan>
    </text>

    <!-- Subtitle: — S T U D I O — -->
    <g transform="translate(2, 34)">
      <line x1="0" y1="-3.5" x2="28" y2="-3.5" stroke="#94A3B8" stroke-width="1.25" stroke-linecap="round" opacity="0.8" />
      <text
        x="36"
        y="0"
        fill="#94A3B8"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="8.5"
        font-weight="700"
        letter-spacing="5"
        opacity="0.95"
      >
        STUDIO
      </text>
      <line x1="124" y1="-3.5" x2="152" y2="-3.5" stroke="#94A3B8" stroke-width="1.25" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>
</svg>
